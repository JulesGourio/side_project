# Quality Scoring Job — Qualibot production turns
#
# Scores the assistant turns already answered by the Knowledge Assistants (no call to the KA endpoints)
# with the MLflow judges and scorers registered in the scoring experiment: 4 LLM judges per turn
# (question intent, answer type and completeness, relevance, language), the user reaction when the
# user wrote again, 2 judges on the cited documents' excerpts (groundedness, missed answer) and the
# safety judge on a 10% sample, plus code scorers. Writes the documented tables
# uat_proj.qualibot.chat_quality_scores, chat_quality_assessments and chat_quality_scoring_runs.
#
# Notebook: utils/quality_monitoring/Score_Production_QA.py
#   base_parameters: source_schema / output_schema / experiment_path / judge_endpoint; max_run_minutes
#   (no batch of turns starts after it, the turns left are scored by the next run); test_limit, dry_run,
#   rescore_changed_config, reset_outputs, feedback_to_agent_traces for ad-hoc runs; fail_on_alert: "true"
#   makes a run that raises a quality alert fail on purpose, which sends the failure e-mail below.
#
# Throughput: judge calls are paced on 70% of the judge model's token limits (200k input and 20k
# output tokens per minute): about 3 turns per minute, 250-300 turns per run of 100 minutes. A backlog
# is absorbed over successive runs; every batch is written as soon as it is scored.

targets:
  qualibot-uat:
    resources:
      jobs:
        quality_scoring:
          # D_<n> prefix: daily job, see the databricks-job-conventions skill (check D_3 is free).
          name: "D_3_qualibot-quality-scoring-${bundle.target}"
          description: "LLM-judge quality scoring of Qualibot production turns (quality + grounding on cited documents)"

          # Two overlapping runs would score the same turns twice.
          max_concurrent_runs: 1

          # Failure e-mail: real failures, and quality alerts once fail_on_alert is "true".
          email_notifications:
            on_failure:
              - jules.gourio.external@latecoere.aero

          tags:
            project: Qualibot
            activity-type: ${var.parsing_job_activity_tag}
            job-purpose: quality-monitoring

          permissions:
            - group_name: "Role-Project-LEAP-CoreAdmin"
              level: CAN_MANAGE
            - group_name: "Role-Project-LEAP-CoreDev"
              level: CAN_MANAGE

          # Same identity as parsing_pipeline / traces_migration on this target (job-runner-sa-uat).
          run_as:
            service_principal_name: 3e5cd4e5-f765-4760-b974-ee7715258b39

          tasks:
            - task_key: "1_score_turns"
              description: "Score new assistant turns with MLflow judges, MERGE into the scores table, run ledger, alerts"
              timeout_seconds: 7200
              # Serverless: HTTP calls to Luna + Vector Search, light Spark SQL.
              environment_key: scoring_env
              notebook_task:
                notebook_path: ../utils/quality_monitoring/Score_Production_QA.py
                source: WORKSPACE
                base_parameters:
                  source_schema: "uat_landingzone.qualibot"
                  output_schema: "uat_proj.qualibot"
                  experiment_path: "/Shared/qualibot-quality-scoring"
                  judge_endpoint: "databricks-gpt-5-6-luna"
                  max_run_minutes: "100"
                  test_limit: ""
                  dry_run: "false"
                  rescore_changed_config: "false"
                  reset_outputs: "false"
                  feedback_to_agent_traces: "false"
                  fail_on_alert: "false"

          environments:
            - environment_key: scoring_env
              spec:
                environment_version: "5"
                # mlflow>=3.11 is checked (and only installed if missing) by the notebook's first cell,
                # with the runtime's packages pinned: a protobuf downgrade prevents the kernel from starting.

          # Twice a day. Align on the refresh of uat_landingzone.qualibot.chat_messages.
          # Left PAUSED until a first manual run (dry_run=true, then reset_outputs=true with test_limit=20)
          # is validated.
          schedule:
            quartz_cron_expression: "0 0 3,15 * * ?"
            timezone_id: "Europe/Paris"
            pause_status: PAUSED
